<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voir Mail type pour le Bourgmestre</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #f9f9f9;
    }
    .big-button {
      display: inline-block;
      font-size: 1.2em;
      padding: 1em 2em;
      width: 90%;
      max-width: 300px;
      text-align: center;
      border: none;
      border-radius: 8px;
      background-color: #007BFF;
      color: white;
      cursor: pointer;
    }
    @media (min-width: 600px) {
      .big-button {
        font-size: 1.4em;
        padding: 1.2em 2.5em;
      }
    }
  </style>
</head>
<body>
  <button class="big-button" id="sendMail">Bekijk standaardmail</button>

  <script>
    // Paramètres du mail
    const to = "kabinet.ph.close@brucity.be";
    const cc = "cabinet.a.maes@brucity.be,stoprodeoatomium@gmail.com";
    const subject = "Stop rodeowaanzin !";
    const body = `Geachte burgemeester,

Ik woon in Laken en schrijf u omdat ik geteisterd word door geluidsoverlast van rodeorijders.

Vandaag was het weer zover: ze laten hun motoren zo luid mogelijk gieren met als enig doel ons, inwoners, zo veel mogelijk te irriteren. De rodeo’s zijn urenlang bezig en vaak tot na middernacht.

Onze buurt wordt al jarenlang ongestraft geteisterd en ik ben deze situatie meer dan beu.

Naast de soms ondraaglijke geluidshinder houd ik mijn hart ook vast voor lichamelijke letsels, of erger, ten gevolge van dit asociaal en gevaarlijk gedrag.

De maatregelen die u tot nu toe genomen heeft om dit probleem in te dijken werken niet. De rodeorijders zijn er nog steeds en dan vooral de motorrijders.

Ik vraag u met aandrang om veel harder en doortastender op te treden tegen dit probleem.

Ik voeg het collectief Stop Rodeo Atomium toe als bestemmeling van deze mail.

Vriendelijke groet,`;

    // Construction du lien mailto avec encodage
    const link = "mailto:" + to
      + "?cc=" + encodeURIComponent(cc)
      + "&subject=" + encodeURIComponent(subject)
      + "&body=" + encodeURIComponent(body);

    document.getElementById('sendMail').addEventListener('click', function() {
      window.location.href = link;
    });
  </script>
</body>
</html>
